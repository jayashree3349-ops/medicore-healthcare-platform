apiVersion: v1
kind: ConfigMap
metadata:
  name: medicore-prometheus-config
  namespace: medicore
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: medicore-api
        metrics_path: /metrics
        static_configs:
          - targets: ["medicore-api:3001"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-prometheus
  namespace: medicore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medicore-prometheus
  template:
    metadata:
      labels:
        app: medicore-prometheus
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: web
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: medicore-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medicore-prometheus
  namespace: medicore
spec:
  type: ClusterIP
  selector:
    app: medicore-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
